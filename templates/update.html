
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo - Update</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

    <div class="container">

        <header>
            <h1>📑 Update Task</h1>
        </header>

        <section class="update-section">

            <a href="{% url 'home' %}" class="back-btn">
                ⬅ BACK
            </a>

            <form method="POST">
                {% csrf_token %}

                <label for="title">Title:</label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ task.title }}"
                    required
                >

                <button type="submit" class="add-btn">
                    SAVE CHANGES
                </button>

            </form>

        </section>

    </div>

</body>
</html>
